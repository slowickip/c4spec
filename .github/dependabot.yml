version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /examples/mini-project
      - /scripts/diagram-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ['*']
        exclude-patterns:
          - likec4
          - skills
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /.agents/skills/c4spec
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
